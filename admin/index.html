<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chapter editor</title>
<link rel="stylesheet" href="/admin/admin.css"></head><body>
<header id="top">
  <strong class="appname">Chapter editor</strong>
  <select id="chapter" aria-label="Chapter"></select>
  <button id="contentBtn">Content</button>
  <button id="pagesBtn" class="pagepick" title="All pages and content"><span id="pageName">Loading…</span> <span id="pageState" class="tag"></span> ▾</button>
  <button id="status" class="pill" aria-live="polite"></button>
  <span id="presence" class="pill" hidden></span>
  <span class="grow"></span>
  <div class="seg" id="deviceSeg" role="group" aria-label="Preview size"><button data-w="desktop">Desktop</button><button data-w="tablet">Tablet</button><button data-w="phone">Phone</button></div>
  <button id="undoBtn" class="icon" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>↶</button><button id="redoBtn" class="icon" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled>↷</button>
  <button id="checksBtn">Checks</button>
  <button id="settingsBtn">Settings</button>
  <button id="viewBtn">Preview</button>
  <button id="moreBtn" aria-haspopup="menu">More ▾</button>
  <button id="publishBtn" class="primary">Publish…</button>
</header>
<main id="main">
  <div id="stage">
    <div id="frameBar"><button id="frameBack" class="small" hidden></button><span id="frameLabel" class="grow"></span><button id="frameExit" class="small" hidden>Back to editing</button></div>
    <div id="frameWrap" data-device="desktop"><iframe id="preview" title="Page preview. Click any text to edit it."></iframe></div>
  </div>
  <aside id="panel" aria-label="Editing panel"></aside>
</main>
<nav id="phonebar" aria-label="Editing actions">
  <button id="pbUndo" aria-label="Undo" disabled>↶<small>Undo</small></button>
  <button id="pbRedo" aria-label="Redo" disabled>↷<small>Redo</small></button>
  <button id="pbPrev" aria-label="Previous section">◀<small>Prev</small></button>
  <button id="pbSection" aria-label="Section options"><span id="pbSection-label">☰</span><small id="pbSectionText"></small></button>
  <button id="pbNext" aria-label="Next section">▶<small>Next</small></button>
  <button id="pbPublish" class="primary">Publish</button>
</nav>
<datalist id="cms-pages"></datalist>
<div id="menu" class="menu" role="menu" hidden></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/admin/text.js"></script><script src="/admin/util.js"></script><script src="/admin/editor.js"></script><script src="/admin/panel.js"></script><script src="/admin/screens.js"></script><script src="/admin/boot.js"></script>
</body></html>
